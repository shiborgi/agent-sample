[project]
name = "agent-sample"
version = "0.1.0"
description = "Classify a message subject through Typer and A2A, with swappable runtimes."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk[http-server]>=1.0",
    "deepagents>=0.7.19",
    "httpx>=0.28",
    "langchain-core>=0.3",
    "langgraph>=0.4",
    "typer>=0.15",
    "uvicorn>=0.34",
]

[project.optional-dependencies]
laya = ["laya>=0.3.21"]

[project.scripts]
subject = "agent_sample.composition:cli_main"
subject-a2a = "agent_sample.composition:a2a_main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.11",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
